- pipeline: Publish dev
  refs:
  - refs/heads/dev
  always_from_scratch: true
  auto_clear_cache: true
  fail_on_prepare_env_warning: true
  environments:
  - release
  variables:
  - key: VERSION_BUMP_TYPE
  - key: npmrc
    value: "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
    type: FILE
    file_path: "~/.npmrc"
  trigger_conditions:
  - trigger_condition: SUCCESS_PIPELINE
    project: ci-info
    pipeline: CI Integration Tests
  actions:
  - action: Select version bump
    type: WAIT_FOR_VARIABLES
    variables:
    - key: VERSION_BUMP_TYPE
      defaults: |-
        prerelease
        prepatch
        preminor
        premajor
  - action: Install packages
    type: BUILD
    execute_commands:
    - pnpm i
    setup_commands:
    - npm i pnpm -g
    shell: BASH
    volume_mappings:
    - /:/buddy-works/ci-info
    docker_image_name: library/node
    docker_image_tag: 22
  - action: Lint
    type: BUILD
    execute_commands:
    - pnpm lint
    - pnpm lint:types
    setup_commands:
    - npm i pnpm -g
    shell: BASH
    volume_mappings:
    - /:/buddy-works/ci-info
    docker_image_name: library/node
    docker_image_tag: 22
  - action: Build
    type: BUILD
    execute_commands:
    - pnpm build
    setup_commands:
    - npm i pnpm -g
    shell: BASH
    volume_mappings:
    - /:/buddy-works/ci-info
    docker_image_name: library/node
    docker_image_tag: 22
  - action: Bump version
    type: BUILD
    execute_commands:
    - git config user.email "ci@buddy.works"
    - git config user.name "Buddy CI"
    - "pnpm version --preid rc $VERSION_BUMP_TYPE -m \"chore(release): bump version to %s\""
    setup_commands:
    - npm i pnpm -g
    shell: BASH
    volume_mappings:
    - /:/buddy-works/ci-info
    docker_image_name: library/node
    docker_image_tag: 22
  - action: Git Push
    type: PUSH
    push_tags: true
    target_branch: $BUDDY_RUN_BRANCH
    isolated: true
    targets:
    - project_repository
  - action: Publish
    type: BUILD
    execute_commands:
    - pnpm publish --no-git-checks --access public --tag rc
    setup_commands:
    - npm i pnpm -g
    shell: BASH
    volume_mappings:
    - /:/buddy-works/ci-info
    docker_image_name: library/node
    docker_image_tag: 22
